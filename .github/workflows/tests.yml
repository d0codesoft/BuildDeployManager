name: scdeploy tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-and-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: |
          for script in scripts/*.sh tests/ubuntu-e2e.sh; do
            bash -n "$script"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  systemd-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-pip sudo util-linux
      - run: sudo bash tests/ubuntu-e2e.sh --isolated-vm --approve
