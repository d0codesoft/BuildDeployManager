[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scdeploy"
version = "0.1.1"
description = "SCODE Build & Deploy Manager"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "cryptography>=43", "packaging>=24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scdeploy = "scdeploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ubuntu: requires an isolated Ubuntu system with systemd"]
